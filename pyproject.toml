[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surrogatekv"
version = "0.1.0"
description = "Representation-preserving KV-cache compression for long-context LLMs"
readme = "README.md"
requires-python = ">=3.10"
# Original SurrogateKV material is proprietary; Apache-2.0 and MIT apply only
# to the third-party-derived portions identified in THIRD_PARTY_NOTICES.md.
license = "LicenseRef-Proprietary AND Apache-2.0 AND MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "legal/third-party/*.txt"]
authors = [
    {name = "Junwon Kim"},
    {name = "Junghyun Ryu"},
    {name = "Farid Talibli"},
    {name = "Jungmin So"},
    {name = "Youngjae Kim"},
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
]

[project.optional-dependencies]
longbench = [
    "accelerate",
    "datasets",
    "fuzzywuzzy",
    "jieba",
    "rouge",
    "tqdm",
    "transformers",
]
dev = ["ruff>=0.8"]
plots = ["matplotlib>=3.6"]

[project.urls]
Repository = "https://github.com/kimjunewon/SurrogateKV"
Issues = "https://github.com/kimjunewon/SurrogateKV/issues"
Data = "https://github.com/kimjunewon/SurrogateKV/tree/main/data"

[tool.setuptools.packages.find]
include = ["surrogatekv*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
